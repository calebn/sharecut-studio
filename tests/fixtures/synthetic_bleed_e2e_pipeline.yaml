# Synthetic bleed fixture — reconcile mode with same audibility heuristics as production.

master:
  integrated_lufs: -16.0
  true_peak_db: -1.5

balance:
  dialogue_lufs: -20.0

compression:
  threshold_db: -18.0
  ratio: 3.0
  attack_ms: 15.0
  release_ms: 150.0
  makeup_db: 2.0

tighten:
  crossfade_ms: 10
  max_pause_sec: 1.2
  filler_words:
    - um
    - uh

mix:
  music_under_vo_db: -18.0
  fade_in_sec: 2.0
  fade_out_sec: 3.0
  duck_db: -10.0

transcribe:
  model: base
  language: en

analysis:
  ml_backend: "off"
  transcript_mode: reconcile
  reconcile_on_render: true
  heuristics:
    audibility_rms_db: -42.0
    bleed_dominance_db: 6.0
    bleed_min_other_rms_db: -50.0
    gate_onset_drop_db: 15.0
    boundary_jump_db: 12.0
    min_fade_ms: 10
    recommended_fade_ms: 20

inaudible_cuts:
  enabled: true
  search_window_ms: 40
  max_shift_ms: 80
  min_word_margin_ms: 5
  micro_fade_ms: 10
  weights:
    energy: 0.65
    zero_cross: 0.2
    continuity: 0.15

export:
  wav: true
  formats:
    - ext: mp3
      codec: libmp3lame
      bitrate_kbps: 128

# FX presets come from effects/presets.py builtins; see .agents/defaults/pipeline.yaml
effects: {}

social_clips:
  default_max_sec: 60
  min_sec: 15
  padding_ms: 150
  max_candidates: 12
