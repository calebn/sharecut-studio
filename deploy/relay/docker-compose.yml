services:
  caddy:
    image: caddy:2-alpine
    ports:
      - "8080:8080"
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
    depends_on:
      podcast-relay:
        condition: service_healthy

  podcast-relay:
    build:
      context: ../..
      dockerfile: deploy/relay/Dockerfile
    environment:
      PODCAST_RELAY_HOST_TOKENS: ${PODCAST_RELAY_HOST_TOKENS:-dev-host-token}
      # Local compose only — never set in production. Empty tokens + this flag open the tunnel.
      PODCAST_RELAY_ALLOW_OPEN_TUNNEL: ${PODCAST_RELAY_ALLOW_OPEN_TUNNEL:-0}
      PODCAST_RELAY_PORT: "8081"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8081/healthz')"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
