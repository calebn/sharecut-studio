name: Set up pinned FFmpeg
description: Build and execute the shared FFmpeg source recipe on the native runner
inputs:
  output:
    description: Complete native payload destination
    default: ""
runs:
  using: composite
  steps:
    - name: Install Linux build tools
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get --error-on=any -o Acquire::Retries=2 update
        sudo apt-get --yes --no-install-recommends install build-essential pkg-config curl
    - name: Install Windows native build tools
      if: runner.os == 'Windows'
      uses: msys2/setup-msys2@v2
      with:
        msystem: MINGW64
        update: true
        install: make mingw-w64-x86_64-gcc mingw-w64-x86_64-pkgconf mingw-w64-x86_64-python curl
    - name: Restore hash-verified source archives
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/ffmpeg-sources
        key: ffmpeg-sources-${{ hashFiles('contracts/ffmpeg-build.json') }}
    - name: Build native Windows payload
      if: runner.os == 'Windows'
      shell: msys2 {0}
      env:
        PAYLOAD_OUTPUT: ${{ inputs.output }}
      run: |
        output="$(cygpath -am "${PAYLOAD_OUTPUT:-$RUNNER_TEMP/sharecut-ffmpeg}")"
        python scripts/build_ffmpeg.py --output "$output" --source-cache "$RUNNER_TEMP/ffmpeg-sources"
        echo "$(cygpath -w /mingw64/bin)" >> "$GITHUB_PATH"
        echo "$(cygpath -w /usr/bin)" >> "$GITHUB_PATH"
        echo "$(cygpath -w "$output/bin")" >> "$GITHUB_PATH"
        echo "PODCAST_MCP_FFMPEG=$(cygpath -m "$output/bin/ffmpeg.exe")" >> "$GITHUB_ENV"
        echo "PODCAST_MCP_FFPROBE=$(cygpath -m "$output/bin/ffprobe.exe")" >> "$GITHUB_ENV"
    - name: Build native Unix payload
      if: runner.os != 'Windows'
      shell: bash
      env:
        PAYLOAD_OUTPUT: ${{ inputs.output }}
      run: |
        output="$(python3 -c 'import pathlib,sys; print(pathlib.Path(sys.argv[1]).absolute())' "${PAYLOAD_OUTPUT:-$RUNNER_TEMP/sharecut-ffmpeg}")"
        python3 scripts/build_ffmpeg.py --output "$output" --source-cache "$RUNNER_TEMP/ffmpeg-sources"
        echo "$output/bin" >> "$GITHUB_PATH"
        echo "PODCAST_MCP_FFMPEG=$output/bin/ffmpeg" >> "$GITHUB_ENV"
        echo "PODCAST_MCP_FFPROBE=$output/bin/ffprobe" >> "$GITHUB_ENV"
    - name: Save source archives
      if: github.ref == 'refs/heads/main'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/ffmpeg-sources
        key: ffmpeg-sources-${{ hashFiles('contracts/ffmpeg-build.json') }}
