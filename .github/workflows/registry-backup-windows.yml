name: registry-backup-windows

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('registry-backup-windows-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.run_attempt == 1 && github.ref == 'refs/heads/main' && 'registry-backup-windows-main' || format('registry-backup-windows-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      skip-native-registry: ${{ steps.plan.outputs.skip-native-registry }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: plan
        uses: ./.github/actions/ci-plan

  native-registry-backup:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.skip-native-registry != '1') }}
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install pinned FFmpeg
        uses: ./.github/actions/setup-ffmpeg
      - name: Install focused test dependencies
        uses: ./.github/actions/install-locked-python
        with:
          extras: dev gui relay
      - name: Provision owned NTFS proof storage
        shell: pwsh
        run: |
          Start-Transcript -Path "$env:RUNNER_TEMP/registry-storage.log"
          try { ./scripts/registry_windows_storage.ps1 } finally { Stop-Transcript }
      - name: Native handles, private DACLs, second-account denial, and lifecycle
        run: >-
          python -m pytest -q --no-cov
          --basetemp "${{ env.SHARECUT_PROOF_ROOT }}/pytest"
          tests/test_share_registry_source_privacy.py
          tests/test_registry_windows_acl_policy.py
          tests/test_registry_privacy_cleanup.py
          tests/test_registry_windows_privacy_error.py
          tests/test_registry_windows_actor_setup.py
          tests/test_registry_backup_windows.py
          tests/test_registry_backup_windows_names.py
          tests/test_registry_backup_cli.py
          tests/test_registry_backup_publisher.py
          tests/test_share_registry_backup_actors.py
          tests/test_share_registry_recovery.py
          tests/test_registry_lifecycle_actors.py
          tests/test_sqlite_tx.py
          tests/test_session_sqlite_initialization.py
          tests/test_object_store_fixture.py
          tests/test_share_registry.py
          tests/test_list_clips_recording.py
          2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/registry-pytest.log";
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Detach owned NTFS proof storage
        if: always()
        shell: pwsh
        run: ./scripts/registry_windows_storage.ps1 -Cleanup
      - name: Preserve native proof receipts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: registry-windows-proof
          path: |
            ${{ runner.temp }}/registry-storage.log
            ${{ runner.temp }}/registry-pytest.log
