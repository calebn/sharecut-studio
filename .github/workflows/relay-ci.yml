name: relay-ci

on:
  pull_request:
    paths:
      - 'deploy/relay/**'
      - 'src/podcast_relay/**'
      - '.github/workflows/relay-ci.yml'

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build and start relay stack
        run: docker compose -f deploy/relay/docker-compose.yml up --build -d

      - name: Wait for relay healthcheck
        run: |
          for i in $(seq 1 20); do
            if curl -sf http://127.0.0.1:8080/healthz; then
              echo "Relay healthy"
              exit 0
            fi
            echo "relay healthcheck attempt $i failed"
            sleep 3
          done
          echo "Relay did not become healthy" >&2
          docker compose -f deploy/relay/docker-compose.yml logs
          exit 1

      - name: Verify healthz response
        run: |
          response=$(curl -sf http://127.0.0.1:8080/healthz)
          echo "$response"
          echo "$response" | python3 -c "
          import sys, json
          d = json.load(sys.stdin)
          assert d.get('ok') is True, f'expected ok=true, got {d}'
          assert isinstance(d.get('version'), str) and d['version'], f'missing version: {d}'
          print('healthz ok')
          "

      - name: Verify offline share returns 503
        run: |
          status=$(curl -o /dev/null -w "%{http_code}" \
            http://127.0.0.1:8080/r/no-such-token-offline-test)
          echo "Status: $status"
          test "$status" = "503"

      - name: Tear down
        if: always()
        run: docker compose -f deploy/relay/docker-compose.yml down
