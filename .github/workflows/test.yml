name: test

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [develop, main]
  workflow_dispatch:
    inputs:
      compatibility-base:
        description: Current SHA of the compatibility-base-ref branch for final release validation; it must be an ancestor of this head
        required: false
        type: string
      compatibility-base-ref:
        description: Branch ref whose tip must equal compatibility-base
        required: false
        default: refs/heads/main
        type: string

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('test-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.run_attempt == 1 && github.ref == 'refs/heads/main' && 'test-main' || github.event_name == 'push' && github.run_attempt == 1 && github.ref == 'refs/heads/develop' && 'test-develop' || format('test-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  changes:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      gui: ${{ steps.plan.outputs.gui }}
      e2e: ${{ steps.plan.outputs.e2e }}
      e2e-matrix: ${{ steps.plan.outputs.e2e-matrix }}
      release-only: ${{ steps.plan.outputs.release-only }}
      pytest: ${{ steps.plan.outputs.pytest }}
      playwright-image: ${{ steps.playwright.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the PR merge base
          persist-credentials: false

      - name: Plan the run
        id: plan
        uses: ./.github/actions/ci-plan

      - name: Resolve the Playwright image
        id: playwright
        uses: ./.github/actions/playwright-image

  pytest-quality:
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Use runner temporary storage
        run: |
          umask 077
          tmpdir="$(mktemp -d /var/tmp/sharecut-ci.XXXXXX)"
          printf 'TMPDIR=%s\n' "$tmpdir" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # docs-sync needs the PR merge base and its commit messages

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install package and dev deps
        uses: ./.github/actions/install-locked-python
        with:
          extras: dev gui relay prosody

      - name: Python lint / format / security / deps
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          bandit -c pyproject.toml -r src -ll
          vulture
          deptry .

      - name: Type check (strict on timebase modules)
        run: mypy

      - name: Verify final release integration identity
        if: github.event_name == 'workflow_dispatch' && inputs.compatibility-base != ''
        env:
          EXPECTED_BASE: ${{ inputs.compatibility-base }}
          EXPECTED_BASE_REF: ${{ inputs.compatibility-base-ref }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          [[ "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_BASE_REF" == refs/heads/* ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin "$EXPECTED_BASE_REF" | cut -f1)" = "$EXPECTED_BASE"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD

      - name: Project and history compatibility
        env:
          COMPAT_BASE: ${{ inputs.compatibility-base || github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          python scripts/project_compat.py check --base "$COMPAT_BASE"
          pytest -q --no-cov tests/test_project_compat.py

      - name: Docs-sync gate (PR diff)
        # Stdlib-only script; runs without the pip install above. Only pull_request has a
        # base/head to diff — a push to develop has nothing to gate against.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: >-
          python3 scripts/docs_sync.py check --range
          "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Conventional Commit subjects (PR commits)
        # Stdlib-only. release-please reads these to pick the next version, and an
        # unparseable subject is silently skipped, so a malformed one fails here instead.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: >-
          python3 scripts/check_conventional_commits.py
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

  pytest-shard:
    name: pytest-shard (${{ matrix.shard }})
    needs: changes
    if: needs.changes.result == 'success' && needs.changes.outputs.pytest != 'quick'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.changes.outputs.pytest == 'full' && '[1,2,3,4]' || '[1]') }}
    env:
      COVERAGE_CORE: ctrace
      PYTEST_SHARD_INDEX: ${{ matrix.shard }}
      PYTEST_SHARD_COUNT: ${{ strategy.job-total }}
      PYTEST_SCOPE: ${{ needs.changes.outputs.pytest }}
    steps:
      - name: Use runner temporary storage
        run: |
          umask 077
          tmpdir="$(mktemp -d /var/tmp/sharecut-ci.XXXXXX)"
          printf 'TMPDIR=%s\n' "$tmpdir" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # tests read git history

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - uses: actions/setup-node@v7 # tests run workflow JS predicates under node
        with:
          node-version: "24"

      - name: Install FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Install package and dev deps
        uses: ./.github/actions/install-locked-python
        with:
          extras: dev gui relay prosody

      - name: Record pytest run context
        env:
          VALIDATED_COMPAT_BASE: ${{ inputs.compatibility-base || github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          mkdir -p test-results
          {
            printf 'Run URL: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Run ID: %s\n' "$GITHUB_RUN_ID"
            printf 'Run attempt: %s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'Event: %s\n' "$GITHUB_EVENT_NAME"
            printf 'GITHUB_SHA: %s\n' "$GITHUB_SHA"
            printf 'Pytest scope: %s\n' "$PYTEST_SCOPE"
            printf 'Shard: %s/%s\n' "$PYTEST_SHARD_INDEX" "$PYTEST_SHARD_COUNT"
            printf 'Checkout SHA: %s\n' "$(git rev-parse HEAD)"
            printf 'Compatibility base: %s\n' "$VALIDATED_COMPAT_BASE"
            printf 'TMPDIR: %s\n' "$TMPDIR"
            df -hT /tmp "$TMPDIR"
            python -VV
            python - <<'PY'
          import os
          from importlib.metadata import version
          from pathlib import Path

          import coverage

          from podcast_mcp.util.registry_privacy import registry_privacy

          with registry_privacy(Path(os.environ["TMPDIR"]), (), create=False) as verify:
              verify()

          probe = coverage.Coverage(data_file=None)
          probe.start()
          try:
              core = dict(probe.sys_info())["core"]
              print(f"Coverage core: {core}")
              if core != "CTracer":
                  raise RuntimeError(f"Expected CTracer, got {core}")
          finally:
              probe.stop()
          print(f"Visible logical CPUs: {os.cpu_count()}")
          print(f"CPU affinity count: {len(os.sched_getaffinity(0))}")
          for package in ("pytest", "pytest-xdist", "pytest-cov", "coverage"):
              print(f"{package}: {version(package)}")
          PY
            ffmpeg -version
            printf 'Pytest invocation: pytest -n auto -m "not e2e_slow and not e2e_real" --cov-fail-under=0 --durations=100 --durations-min=0.1 --junitxml=test-results/pytest.xml | tee test-results/pytest.log\n'
            printf 'Worker policy: -n auto; tests/conftest.py caps automatic workers at four.\n'
            printf 'Coverage provenance: pyproject.toml pytest addopts collect coverage; this shard gates nothing (--cov-fail-under=0) and its TOTAL is partial; the pytest job combines the shards and enforces coverage report --fail-under=95.\n'
          } > test-results/context.txt

      - name: Run tests with coverage gate
        if: env.PYTEST_SCOPE == 'full'
        # Exclude HF-backed / nightly tiers (e2e_slow, e2e_real); keep fast e2e for coverage.
        # Per-test --timeout=60 comes from pyproject addopts (pytest-timeout).
        # A shard sees a quarter of the suite, so it records coverage and gates nothing;
        # the pytest job combines the shard files and enforces the floor.
        run: |
          set -o pipefail
          COVERAGE_FILE=cov/shard-$PYTEST_SHARD_INDEX pytest -n auto -m "not e2e_slow and not e2e_real" --cov-fail-under=0 --durations=100 --durations-min=0.1 --junitxml=test-results/pytest.xml | tee test-results/pytest.log

      - name: Run the tests that read gui/web
        # A web-only PR cannot move Python coverage; develop pushes and promotion keep the floor.
        if: env.PYTEST_SCOPE == 'web'
        run: |
          set -o pipefail
          web_tests="$(python3 scripts/ci_plan.py subset-tests web)"
          pytest -n auto --no-cov -m "not e2e_slow and not e2e_real" --durations=100 --durations-min=0.1 --junitxml=test-results/pytest.xml $web_tests | tee test-results/pytest.log

      - name: Run the tests that read docs
        # A docs-only PR touches no Python; develop pushes and promotion keep the full suite.
        if: env.PYTEST_SCOPE == 'docs'
        run: |
          set -o pipefail
          docs_tests="$(python3 scripts/ci_plan.py subset-tests docs)"
          pytest -n auto --no-cov -m "not e2e_slow and not e2e_real" --durations=100 --durations-min=0.1 --junitxml=test-results/pytest.xml $docs_tests | tee test-results/pytest.log

      - name: Run the tests that read gui/web or docs
        if: env.PYTEST_SCOPE == 'web-docs'
        run: |
          set -o pipefail
          union_tests="$(python3 scripts/ci_plan.py subset-tests web-docs)"
          pytest -n auto --no-cov -m "not e2e_slow and not e2e_real" --durations=100 --durations-min=0.1 --junitxml=test-results/pytest.xml $union_tests | tee test-results/pytest.log

      - name: Run the tests the diff reaches
        if: env.PYTEST_SCOPE == 'changed'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -o pipefail
          changed_tests="$(python3 scripts/ci_plan.py changed-tests --base "$BASE_SHA" --head "$HEAD_SHA")"
          test -n "$changed_tests" || { echo "the plan chose the changed scope but no test file is reached" >&2; exit 1; }
          pytest -n auto --no-cov -m "not e2e_slow and not e2e_real" --durations=100 --durations-min=0.1 --junitxml=test-results/pytest.xml $changed_tests | tee test-results/pytest.log

      - name: Run release policy and planner tests
        if: env.PYTEST_SCOPE == 'release'
        run: |
          set -o pipefail
          python3 scripts/version_policy.py
          release_tests="$(python3 scripts/ci_plan.py subset-tests release)"
          pytest -n auto --no-cov -m "not e2e_slow and not e2e_real" --durations=100 --durations-min=0.1 --junitxml=test-results/pytest.xml $release_tests | tee test-results/pytest.log

      - name: Upload coverage data
        if: always() && env.PYTEST_SCOPE == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: pytest-coverage-${{ matrix.shard }}
          path: cov/
          include-hidden-files: false
          if-no-files-found: error
          overwrite: true

      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-reports-${{ matrix.shard }}
          path: test-results/
          retention-days: 7
          overwrite: true

  pytest:
    needs: [changes, pytest-quality, pytest-shard]
    if: ${{ always() && github.event.pull_request.draft != true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Require the plan, quality and every planned shard to succeed
        env:
          PLAN: ${{ needs.changes.result }}
          SCOPE: ${{ needs.changes.outputs.pytest }}
          QUALITY: ${{ needs.pytest-quality.result }}
          SHARDS: ${{ needs.pytest-shard.result }}
        run: |
          case "$PLAN:$SCOPE:$QUALITY:$SHARDS" in
            success:quick:success:skipped | success:full:success:success | success:web:success:success | success:docs:success:success | success:web-docs:success:success | success:changed:success:success | success:release:success:success) exit 0 ;;
            *)
              printf 'Invalid plan or pytest result: %s/%s/%s/%s\n' "$PLAN" "$SCOPE" "$QUALITY" "$SHARDS" >&2
              exit 1
              ;;
          esac

      - uses: actions/checkout@v7
        if: always()

      - name: Download pytest reports
        if: always() && needs.changes.outputs.pytest != 'quick'
        uses: actions/download-artifact@v8
        with:
          pattern: pytest-reports-*
          path: test-results/

      - name: Summarize Python tests
        if: always() && needs.changes.outputs.pytest != 'quick'
        continue-on-error: true
        run: |
          for report in test-results/pytest-reports-*/pytest.xml; do
            dir="${report%/pytest.xml}"
            python3 scripts/test_area_summary.py junit --area python --report "$report" --label "shard ${dir##*-}"
          done

      - uses: actions/setup-python@v7
        if: needs.changes.outputs.pytest == 'full'
        with:
          python-version: "3.14"

      - name: Install the locked coverage version
        if: needs.changes.outputs.pytest == 'full'
        run: |
          pip install uv
          pip install "$(uv export --locked --no-emit-project --no-hashes --extra dev | grep '^coverage==')"

      - name: Download coverage data
        if: needs.changes.outputs.pytest == 'full'
        uses: actions/download-artifact@v8
        with:
          pattern: pytest-coverage-*
          path: cov/
          merge-multiple: true

      - name: Combine coverage and enforce the floor
        if: needs.changes.outputs.pytest == 'full'
        run: |
          test "$(ls cov/shard-* | wc -l)" -eq 4 || { echo "Expected 4 cov/shard-* files, found: $(ls cov)" >&2; exit 1; }
          coverage combine cov/shard-*
          coverage report --fail-under=95
          coverage xml -o coverage.xml

      - name: Upload coverage.xml
        if: always() && needs.changes.outputs.pytest == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

  # requires-python is >=3.11 but the full suite runs on 3.14. This runs the tests that pin the
  # 3.11 `wave` gap (WAVE_FORMAT_EXTENSIBLE, #1183) on the floor. Advisory: not in the
  # required repository merge checks.
  pytest-python-floor:
    needs: changes
    if: ${{ !cancelled() && github.event.pull_request.draft != true && (needs.changes.result != 'success' || (needs.changes.outputs.release-only != '1' && needs.changes.outputs.pytest != 'quick')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Install package and dev deps
        uses: ./.github/actions/install-locked-python
        with:
          extras: dev gui

      - name: Extensible-WAV readers on the lowest supported Python
        run: pytest -q --no-cov tests/test_wav_util.py tests/test_bleed_gate_channels.py

  frontend-suite:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gui/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/web/package-lock.json

      - run: npm ci
      - name: Install exporter Python deps
        # export_project_types.py imports the Pydantic models.
        uses: ./.github/actions/install-locked-python
        with:
          environment: frontend-exporters
      - name: Biome-formatted generated copies are current
        # These exporters need Biome (gui/web/node_modules), so they run here, not
        # in the pytest job. setup-python pins the pytest job's 3.12.
        # tests/test_generated_artifacts.py requires every exporter to run in one of the two.
        working-directory: .
        run: |
          python3 scripts/export_capabilities_copy.py --check
          python3 scripts/export_timeline_zoom.py --check
          python3 scripts/export_limit_contracts.py --check
          python3 scripts/export_project_types.py --check
      - name: npm audit (production deps, non-blocking)
        id: npm-audit
        # Advisory only: surfaces high/critical advisories in shipped runtime
        # deps without making the required `frontend` check depend on upstream
        # advisory timing. Dependabot (.github/dependabot.yml) opens the fix PRs.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Summarize npm audit findings
        # continue-on-error keeps `conclusion` green; `outcome` still reports failure.
        if: steps.npm-audit.outcome == 'failure'
        run: |
          {
            echo "### npm audit (advisory): high/critical advisories in production deps"
            echo
            echo "\`npm audit --omit=dev --audit-level=high\` failed in \`gui/web\` (non-blocking). Open the npm audit step log for details."
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Run Vitest
        run: npm test -- --reporter=default --reporter=json --outputFile.json=test-results/vitest.json
      - run: npm run build
      - name: Summarize Vitest tests
        if: always()
        continue-on-error: true
        working-directory: .
        run: python3 scripts/test_area_summary.py vitest --area vitest --report gui/web/test-results/vitest.json
      - name: Keymap cheatsheet docs stay generated
        run: npm run cheatsheet:check

  frontend:
    runs-on: ubuntu-24.04
    needs: [changes, frontend-suite]
    if: ${{ always() && github.event.pull_request.draft != true }}
    steps:
      - name: Require the plan and the planned frontend suite to succeed
        shell: bash
        env:
          PLAN: ${{ needs.changes.result }}
          GUI: ${{ needs.changes.outputs.gui }}
          SUITES: ${{ needs.frontend-suite.result }}
        run: &require-planned-suite |
          case "$PLAN:$GUI:$SUITES" in
            success:true:success|success:false:skipped) exit 0 ;;
            *) printf 'Invalid plan or suite result: %s/%s/%s\n' "$PLAN" "$GUI" "$SUITES" >&2; exit 1 ;;
          esac

  frontend-e2e-suites:
    name: frontend-e2e-${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.changes.outputs.playwright-image }}
      options: --init --ipc=host
    timeout-minutes: 60
    strategy:
      # One red suite cancels the rest; a rerun repeats the whole set anyway.
      fail-fast: true
      # scripts/ci_plan.py: the smoke job on a PR; the four main shards, then complete
      # Chromium and WebKit compat on dispatch (promotion); WebKit shards on a release PR.
      matrix: ${{ fromJSON(needs.changes.outputs.e2e-matrix) }}
    env:
      PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/${{ matrix.name }}.json
      TEST_AREA: ${{ startsWith(matrix.name, 'main-') && 'main-e2e' || 'compat-e2e' }}
    steps:
      - name: Use runner temporary storage
        run: |
          umask 077
          tmpdir="$(mktemp -d /var/tmp/sharecut-ci.XXXXXX)"
          printf 'TMPDIR=%s\n' "$tmpdir" >> "$GITHUB_ENV"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/web/package-lock.json

      - name: Install GUI Python deps
        uses: ./.github/actions/install-locked-python
        with:
          extras: gui

      - name: Install frontend deps
        timeout-minutes: 10
        working-directory: gui/web
        run: |
          printf 'TMPDIR: %s\n' "$TMPDIR"
          df -hT /tmp "$TMPDIR"
          python - <<'PY'
          import os
          from pathlib import Path

          from podcast_mcp.util.registry_privacy import registry_privacy

          with registry_privacy(Path(os.environ["TMPDIR"]), (), create=False) as verify:
              verify()
          PY
          npm ci

      - name: Build Sharecut Studio static assets
        working-directory: gui/web
        run: VITE_SHARECUT_E2E=1 npm run build

      - name: Playwright ${{ matrix.name }}
        working-directory: gui/web
        run: ${{ matrix.command }}

      - name: Summarize Playwright tests
        if: always()
        continue-on-error: true
        run: >-
          python3 scripts/test_area_summary.py playwright --area "$TEST_AREA"
          --label "${{ matrix.name }}" --report "gui/web/$PLAYWRIGHT_JSON_OUTPUT_FILE"

      - name: Upload Playwright timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-reports-${{ matrix.name }}
          path: gui/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload touch-peek screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-touch-peek-${{ matrix.name }}
          path: |
            gui/web/test-results/**/stow-portrait-360-2-mid-drag-*.png
            gui/web/test-results/**/restored-focus-portrait-360-*.png
            gui/web/test-results/**/stow-landscape-636-2-mid-drag-*.png
            gui/web/test-results/**/restored-focus-landscape-636-*.png
            gui/web/test-results/**/pending-card-portrait-390-32-*.png
            gui/web/test-results/**/pending-card-landscape-636-32-*.png
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright traces from failed specs
        if: always() && hashFiles('gui/web/test-results/**/trace.zip', 'gui/web/test-results/**/error-context.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.name }}
          path: |
            gui/web/test-results/**/trace.zip
            gui/web/test-results/**/error-context.md
          retention-days: 7
          if-no-files-found: ignore

  frontend-e2e:
    runs-on: ubuntu-24.04
    needs: [changes, frontend-e2e-suites]
    if: ${{ always() && github.event.pull_request.draft != true }}
    steps:
      - name: Require the plan and every planned browser suite to succeed
        shell: bash
        env:
          PLAN: ${{ needs.changes.result }}
          GUI: ${{ needs.changes.outputs.e2e }}
          SUITES: ${{ needs.frontend-e2e-suites.result }}
        run: *require-planned-suite
