name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Nightly full run: every browser suite on both engines and the coverage floor,
  # whatever the day's PRs skipped.
  schedule:
    - cron: "23 7 * * *"
  workflow_dispatch:
    inputs:
      compatibility-base:
        description: Current main SHA for final release validation; it must be an ancestor of this head
        required: false
        type: string

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('test-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.run_attempt == 1 && github.ref == 'refs/heads/main' && 'test-main' || format('test-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      gui: ${{ steps.plan.outputs.gui }}
      e2e-matrix: ${{ steps.plan.outputs.e2e-matrix }}
      release-only: ${{ steps.plan.outputs.release-only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the PR merge base
          persist-credentials: false

      - name: Plan the run
        id: plan
        uses: ./.github/actions/ci-plan

  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # docs-sync needs the PR merge base and its commit messages

      # Planned in-job, not from `changes`, so this required check never skips.
      - name: Plan the pytest scope
        id: plan
        uses: ./.github/actions/ci-plan

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - uses: actions/setup-node@v7 # tests run workflow JS predicates under node
        with:
          node-version: "24"

      - name: Install FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Install package and dev deps
        uses: ./.github/actions/install-locked-python
        with:
          extras: dev gui relay prosody

      - name: Python lint / format / security / deps
        run: |
          ruff check src tests scripts
          ruff format --check src tests scripts
          bandit -c pyproject.toml -r src -ll
          vulture
          deptry .

      - name: Type check (strict on timebase modules)
        run: mypy

      - name: Verify final release integration identity
        if: github.event_name == 'workflow_dispatch' && inputs.compatibility-base != ''
        env:
          EXPECTED_BASE: ${{ inputs.compatibility-base }}
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          [[ "$EXPECTED_BASE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_BASE"
          git merge-base --is-ancestor "$EXPECTED_BASE" HEAD

      - name: Project and history compatibility
        env:
          COMPAT_BASE: ${{ inputs.compatibility-base || github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          python scripts/project_compat.py check --base "$COMPAT_BASE"
          pytest -q --no-cov tests/test_project_compat.py

      - name: Record pytest run context
        env:
          VALIDATED_COMPAT_BASE: ${{ inputs.compatibility-base || github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: |
          mkdir -p test-results
          {
            printf 'Run URL: %s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID"
            printf 'Run ID: %s\n' "$GITHUB_RUN_ID"
            printf 'Run attempt: %s\n' "$GITHUB_RUN_ATTEMPT"
            printf 'Event: %s\n' "$GITHUB_EVENT_NAME"
            printf 'GITHUB_SHA: %s\n' "$GITHUB_SHA"
            printf 'Pytest scope: %s\n' "${{ steps.plan.outputs.pytest }}"
            printf 'Checkout SHA: %s\n' "$(git rev-parse HEAD)"
            printf 'Compatibility base: %s\n' "$VALIDATED_COMPAT_BASE"
            python -VV
            python - <<'PY'
          from importlib.metadata import version

          for package in ("pytest", "pytest-xdist", "pytest-cov", "coverage"):
              print(f"{package}: {version(package)}")
          PY
            ffmpeg -version
            printf 'Pytest invocation: pytest -n auto -m "not e2e_slow and not e2e_real" --durations=100 --durations-min=0.1 --junitxml=test-results/pytest.xml | tee test-results/pytest.log\n'
            printf 'Worker policy: -n auto; tests/conftest.py caps automatic workers at four.\n'
            printf 'Coverage provenance: pyproject.toml pytest addopts collect coverage and write coverage.xml; coverage report --fail-under=95 is a separate gate.\n'
          } > test-results/context.txt

      - name: Run tests with coverage gate
        if: steps.plan.outputs.pytest == 'full'
        # Exclude HF-backed / nightly tiers (e2e_slow, e2e_real); keep fast e2e for coverage.
        # Per-test --timeout=60 comes from pyproject addopts (pytest-timeout).
        # xdist can leave pytest exit 0 even when --cov-fail-under fails; enforce via coverage.
        run: |
          set -o pipefail
          pytest -n auto -m "not e2e_slow and not e2e_real" --durations=100 --durations-min=0.1 --junitxml=test-results/pytest.xml | tee test-results/pytest.log
          coverage report --fail-under=95

      - name: Run the tests that read gui/web
        # A web-only PR cannot move Python coverage; main and nightly keep the floor.
        if: steps.plan.outputs.pytest == 'web'
        run: |
          set -o pipefail
          web_tests="$(python3 scripts/ci_plan.py subset-tests web)"
          pytest -n auto --no-cov -m "not e2e_slow and not e2e_real" --durations=100 --durations-min=0.1 --junitxml=test-results/pytest.xml $web_tests | tee test-results/pytest.log

      - name: Run the tests that read docs
        # A docs-only PR touches no Python; main and nightly keep the full suite.
        if: steps.plan.outputs.pytest == 'docs'
        run: |
          set -o pipefail
          docs_tests="$(python3 scripts/ci_plan.py subset-tests docs)"
          pytest -n auto --no-cov -m "not e2e_slow and not e2e_real" --durations=100 --durations-min=0.1 --junitxml=test-results/pytest.xml $docs_tests | tee test-results/pytest.log

      - name: Run release policy and planner tests
        if: steps.plan.outputs.pytest == 'release'
        run: |
          set -o pipefail
          python3 scripts/version_policy.py
          release_tests="$(python3 scripts/ci_plan.py subset-tests release)"
          pytest -n auto --no-cov -m "not e2e_slow and not e2e_real" --durations=100 --durations-min=0.1 --junitxml=test-results/pytest.xml $release_tests | tee test-results/pytest.log

      - name: Docs-sync gate (PR diff)
        # Stdlib-only script; runs without the pip install above. Only pull_request has a
        # base/head to diff — a push to main has nothing to gate against.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: >-
          python3 scripts/docs_sync.py check --range
          "${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"

      - name: Conventional Commit subjects (PR commits)
        # Stdlib-only. release-please reads these to pick the next version, and an
        # unparseable subject is silently skipped, so a malformed one fails here instead.
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: >-
          python3 scripts/check_conventional_commits.py
          "${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      - name: Summarize Python tests
        if: always()
        continue-on-error: true
        run: python3 scripts/test_area_summary.py junit --area python --report test-results/pytest.xml

      - name: Upload coverage.xml
        if: always() && steps.plan.outputs.pytest == 'full'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload pytest reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-reports
          path: test-results/
          retention-days: 7

  # requires-python is >=3.11 but the full suite runs on 3.12. This runs the tests that pin the
  # 3.11 `wave` gap (WAVE_FORMAT_EXTENSIBLE, #1183) on the floor. Advisory: not in the
  # required repository merge checks.
  pytest-python-floor:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.release-only != '1') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - name: Install package and dev deps
        uses: ./.github/actions/install-locked-python
        with:
          extras: dev gui

      - name: Extensible-WAV readers on the lowest supported Python
        run: pytest -q --no-cov tests/test_wav_util.py tests/test_bleed_gate_channels.py

  frontend-suite:
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: gui/web
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/web/package-lock.json

      - run: npm ci
      - name: Install GUI Python deps
        # export_project_types.py imports the Pydantic models.
        uses: ./.github/actions/install-locked-python
        with:
          extras: gui
      - name: Biome-formatted generated copies are current
        # These exporters need Biome (gui/web/node_modules), so they run here, not
        # in the pytest job. setup-python pins the pytest job's 3.12.
        # tests/test_generated_artifacts.py requires every exporter to run in one of the two.
        working-directory: .
        run: |
          python3 scripts/export_capabilities_copy.py --check
          python3 scripts/export_timeline_zoom.py --check
          python3 scripts/export_limit_contracts.py --check
          python3 scripts/export_project_types.py --check
      - name: npm audit (production deps, non-blocking)
        id: npm-audit
        # Advisory only: surfaces high/critical advisories in shipped runtime
        # deps without making the required `frontend` check depend on upstream
        # advisory timing. Dependabot (.github/dependabot.yml) opens the fix PRs.
        continue-on-error: true
        run: npm audit --omit=dev --audit-level=high
      - name: Summarize npm audit findings
        # continue-on-error keeps `conclusion` green; `outcome` still reports failure.
        if: steps.npm-audit.outcome == 'failure'
        run: |
          {
            echo "### npm audit (advisory): high/critical advisories in production deps"
            echo
            echo "\`npm audit --omit=dev --audit-level=high\` failed in \`gui/web\` (non-blocking). Open the npm audit step log for details."
          } >> "$GITHUB_STEP_SUMMARY"
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - name: Run Vitest
        run: npm test -- --reporter=default --reporter=json --outputFile.json=test-results/vitest.json
      - run: npm run build
      - name: Summarize Vitest tests
        if: always()
        continue-on-error: true
        working-directory: .
        run: python3 scripts/test_area_summary.py vitest --area vitest --report gui/web/test-results/vitest.json
      - name: Keymap cheatsheet docs stay generated
        run: npm run cheatsheet:check

  frontend:
    runs-on: ubuntu-latest
    needs: [changes, frontend-suite]
    if: always()
    steps:
      - name: Require the plan and the planned frontend suite to succeed
        shell: bash
        env:
          PLAN: ${{ needs.changes.result }}
          GUI: ${{ needs.changes.outputs.gui }}
          SUITES: ${{ needs.frontend-suite.result }}
        run: &require-planned-suite |
          case "$PLAN:$GUI:$SUITES" in
            success:true:success|success:false:skipped) exit 0 ;;
            *) printf 'Invalid plan or suite result: %s/%s/%s\n' "$PLAN" "$GUI" "$SUITES" >&2; exit 1 ;;
          esac

  frontend-e2e-suites:
    name: frontend-e2e-${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.gui == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      # One red suite cancels the rest; a rerun repeats the whole set anyway.
      fail-fast: true
      # scripts/ci_plan.py: four main shards everywhere, then complete Chromium
      # and WebKit compat on main, nightly and dispatch, or every WebKit compat
      # spec in shards on a PR.
      matrix: ${{ fromJSON(needs.changes.outputs.e2e-matrix) }}
    env:
      PLAYWRIGHT_JSON_OUTPUT_FILE: playwright-report/${{ matrix.name }}.json
      TEST_AREA: ${{ startsWith(matrix.name, 'main-') && 'main-e2e' || 'compat-e2e' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            uv.lock

      - name: Install FFmpeg
        uses: ./.github/actions/setup-ffmpeg

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/web/package-lock.json

      - name: Install GUI Python deps
        uses: ./.github/actions/install-locked-python
        with:
          extras: gui

      - name: Install frontend deps and browser engines
        working-directory: gui/web
        run: |
          npm ci
          npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build Sharecut Studio static assets
        working-directory: gui/web
        run: VITE_SHARECUT_E2E=1 npm run build

      - name: Playwright ${{ matrix.name }}
        working-directory: gui/web
        run: ${{ matrix.command }}

      - name: Summarize Playwright tests
        if: always()
        continue-on-error: true
        run: >-
          python3 scripts/test_area_summary.py playwright --area "$TEST_AREA"
          --label "${{ matrix.name }}" --report "gui/web/$PLAYWRIGHT_JSON_OUTPUT_FILE"

      - name: Upload Playwright timing reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-reports-${{ matrix.name }}
          path: gui/web/playwright-report/
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload Playwright traces from failed specs
        if: always() && hashFiles('gui/web/test-results/**/trace.zip', 'gui/web/test-results/**/error-context.md') != ''
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results-${{ matrix.name }}
          path: |
            gui/web/test-results/**/trace.zip
            gui/web/test-results/**/error-context.md
          retention-days: 7
          if-no-files-found: ignore

  frontend-e2e:
    runs-on: ubuntu-latest
    needs: [changes, frontend-e2e-suites]
    if: always()
    steps:
      - name: Require the plan and every planned browser suite to succeed
        shell: bash
        env:
          PLAN: ${{ needs.changes.result }}
          GUI: ${{ needs.changes.outputs.gui }}
          SUITES: ${{ needs.frontend-e2e-suites.result }}
        run: *require-planned-suite
