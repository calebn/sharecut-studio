# Manual only (workflow_dispatch). Run it from the Actions tab with the base branch selected (or
# `gh workflow run release-please.yml --ref develop`) when you want a release. Run 1 opens or
# refreshes the "release" PR on the base branch (config/branches.json); it reaches main with the
# nightly promotion. Run 2 creates the vX.Y.Z tag and GitHub release, and the guard step refuses
# to run until the manifest-touching commit is on main. It no longer runs on every
# push to main, because each run refreshed the release PR and re-ran its CI.
#
# Opens or refreshes a "release" PR that bumps the Sharecut Studio version everywhere and writes
# the changelog from Conventional Commits. Merging it is the decision to cut a tester build;
# sharecut-ops then builds and publishes the update feed at that tag. This workflow builds
# and publishes nothing itself. See docs/desktop-packaging.md § Version bumps.
#
# Versions stay 0.x: release-please-config.json maps breaking changes to minor and features
# to patch below 1.0, and scripts/version_policy.py (tests/test_version_policy.py) fails any
# PR whose version reaches 1.0.0.
#
# RELEASE_PLEASE_TOKEN is a PAT or app token with contents and pull-requests write. PRs opened
# with the default GITHUB_TOKEN do not start the required CI checks, so the release PR could
# not merge. The fallback keeps the workflow running until the secret exists.

name: release-please

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read the base and release branches
        id: branches
        run: |
          echo "base=$(python3 scripts/branches.py base)" >> "$GITHUB_OUTPUT"
          echo "release=$(python3 scripts/branches.py release)" >> "$GITHUB_OUTPUT"

      - name: Refuse to continue while a manifest-touching commit is not on the release branch
        # The release PR lands on the base branch and reaches the release branch with the
        # nightly promotion. Tagging or refreshing before that would build a release from
        # a commit that has not passed the full suite.
        env:
          BASE: ${{ steps.branches.outputs.base }}
          RELEASE: ${{ steps.branches.outputs.release }}
        run: |
          last="$(git log -1 --format=%H "origin/$BASE" -- .release-please-manifest.json)"
          if [ -n "$last" ] && ! git merge-base --is-ancestor "$last" "origin/$RELEASE"; then
            echo "::error::manifest change $last is on $BASE but not yet on $RELEASE; rerun after the nightly promotion"
            exit 1
          fi

      - uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          target-branch: ${{ steps.branches.outputs.base }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
