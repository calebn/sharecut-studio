# Unsigned FOSS Tauri **scaffold** (clippy --lib). No installer.
# Full Win/Linux/mac-x64 bundles use the reusable desktop build workflow.
# Signed macOS/Windows: same workflow with sign=true + Environment desktop-signing secrets (see docs/desktop-packaging.md).

name: desktop

on:
  pull_request:
    paths: &desktop-paths
      - "gui/desktop/**"
      - "gui/web/**"
      - "src/podcast_mcp/**"
      - "scripts/check_desktop.sh"
      - "scripts/build_desktop.sh"
      - "scripts/build_sidecar.py"
      - "scripts/sidecar_*.rs"
      - "tests/test_pinned_media.py"
      - "tests/test_project_commit_lock.py"
      - "tests/test_history.py"
      - "tests/test_review_versions.py"
      - "tests/test_ffmpeg_diagnostics.py"
      - "tests/test_binaries.py"
      - "tests/test_bootstrap_gui.py"
      - "tests/test_pipeline_config.py"
      - "tests/test_waveform_pyramid.py"
      - "tests/test_verify_ffmpeg_baseline.py"
      - "scripts/verify_ffmpeg_baseline.py"
      - "scripts/build_ffmpeg.py"
      - "contracts/ffmpeg-build.json"
      - ".github/actions/setup-ffmpeg/**"
      - "tests/process_helpers.py"
      - "tests/review_platform.py"
      - "tests/conftest.py"
      - "pyproject.toml"
      - ".github/workflows/desktop.yml"
      - ".github/workflows/ffmpeg-sources.yml"
  push:
    branches: [main]
    paths: *desktop-paths
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ffmpeg-sources:
    uses: ./.github/workflows/ffmpeg-sources.yml
    permissions:
      contents: read
    with:
      source-repository: ${{ github.repository }}
      source-sha: ${{ github.sha }}

  web-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gui/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: gui-web-dist
          path: gui/web/dist

  # Full `tauri build` needs platform runners + icons; scaffold + light Rust hygiene.
  # Same script as `make test-desktop` / scripts/check_desktop.sh (clippy/tests --lib only).
  desktop-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: web-dist
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check desktop (scaffold + rustfmt + clippy + lib tests)
        run: ./scripts/check_desktop.sh

  # Compile the Windows-only WebView2 adapters without producing an installer.
  # Full NSIS packaging remains in release-desktop-build.yml.
  desktop-windows-check:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: web-dist
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: gui-web-dist
          path: gui/web/dist
      - name: Stage Windows desktop sidecar stub
        run: python scripts/tauri_sidecar_hook.py --dev-stub
      - name: Report duplicate Windows desktop dependencies
        working-directory: gui/desktop/src-tauri
        run: cargo tree --locked -d --target x86_64-pc-windows-msvc --features app
      - name: Check Windows desktop binary
        working-directory: gui/desktop/src-tauri
        run: cargo check --bin sharecut --features app
      # Typecheck + test the cfg(windows) arms of the standalone sidecar launcher.
      - name: Check Windows sidecar launcher
        shell: bash
        run: |
          rustc --edition 2021 scripts/sidecar_launcher.rs -o "$RUNNER_TEMP/sharecut-sidecar.exe"
          rustc --edition 2021 --test scripts/sidecar_launcher.rs -o "$RUNNER_TEMP/sidecar-launcher-test.exe"
          "$RUNNER_TEMP/sidecar-launcher-test.exe"

  # Run the Windows fallback of pinned media reads (util/pinned_media.py) on real Windows:
  # file IDs, junction checks, open-file rename blocking and seek + read without pread.
  pinned-media-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the requires-python floor; 3.12 is the desktop sidecar's Python.
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - &install-python-dev-deps
        name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"
      - &provision-windows-storage
        name: Provision owned NTFS proof storage
        shell: pwsh
        run: ./scripts/registry_windows_storage.ps1
      - name: Pinned media tests
        run: python -m pytest -q --no-cov --basetemp "${{ env.SHARECUT_PROOF_ROOT }}/pinned-pytest" tests/test_pinned_media.py
      - &cleanup-windows-storage
        name: Detach owned NTFS proof storage
        if: always()
        shell: pwsh
        run: ./scripts/registry_windows_storage.ps1 -Cleanup

  ffmpeg-resolver-windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[gui,dev]"
      - *provision-windows-storage
      - name: Resolver and acceptance boundary tests
        run: >-
          python -m pytest -q --no-cov
          --basetemp "${{ env.SHARECUT_PROOF_ROOT }}/resolver-pytest"
          tests/test_binaries.py
          tests/test_verify_ffmpeg_baseline.py
          tests/test_ffmpeg_diagnostics.py
      - *cleanup-windows-storage

  # Run the cross-process project commit-lock tests (history + commit transaction,
  # review publication) on real Windows: review publication needs FFmpeg and fails
  # closed on Windows, so its staging tests skip there via the markers in tests/review_platform.py (see
  # docs/persistence.md's Inventory row for review publication).
  project-commit-lock-windows:
    needs: ffmpeg-sources
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build pinned FFmpeg
        uses: ./.github/actions/setup-ffmpeg
        with:
          source-artifact: ${{ needs.ffmpeg-sources.outputs.artifact-name }}
      - *install-python-dev-deps
      - *provision-windows-storage
      # Two separate steps: pwsh only fails the job on the last command's exit code.
      - name: Project commit-lock and history tests
        run: python -m pytest --no-cov -q -rs --basetemp "${{ env.SHARECUT_PROOF_ROOT }}/history-pytest" tests/test_project_commit_lock.py tests/test_history.py --timeout=180
      - name: Review publication tests
        run: python -m pytest --no-cov -q -rs --basetemp "${{ env.SHARECUT_PROOF_ROOT }}/review-pytest" tests/test_review_versions.py --timeout=180
      - *cleanup-windows-storage

  ffmpeg-native-payload:
    needs: ffmpeg-sources
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15-intel, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: ./.github/actions/setup-ffmpeg
        with:
          source-artifact: ${{ needs.ffmpeg-sources.outputs.artifact-name }}
          output: ${{ runner.temp }}/sharecut-runtime/ffmpeg
      - name: Repeat payload verification through the sidecar builder
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          @'
          import os
          import runpy
          import sys
          from pathlib import Path

          assert Path(sys.executable).resolve().is_relative_to(Path(os.environ["pythonLocation"]).resolve())
          original_path = os.environ["PATH"]
          sidecar = runpy.run_path("scripts/build_sidecar.py")
          runtime = Path(os.environ["RUNNER_TEMP"]) / "sharecut-runtime"
          for _ in range(2):
              sidecar["ensure_ffmpeg_payload"](runtime, "x86_64-pc-windows-msvc")
          assert os.environ["PATH"] == original_path
          '@ | python -
      - uses: actions/upload-artifact@v7
        with:
          name: ffmpeg-native-${{ matrix.os }}
          path: ${{ runner.temp }}/sharecut-runtime/ffmpeg

  ffmpeg-linux-newer-host:
    needs: ffmpeg-native-payload
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v8
        with:
          name: ffmpeg-native-ubuntu-22.04
          path: ${{ runner.temp }}/sharecut-ffmpeg
      - name: Execute Ubuntu 22.04 payload on Ubuntu 24.04
        env:
          PAYLOAD: ${{ runner.temp }}/sharecut-ffmpeg
        run: |
          chmod +x "$PAYLOAD/bin/ffmpeg" "$PAYLOAD/bin/ffprobe"
          python scripts/build_ffmpeg.py --output "$PAYLOAD" --verify-only
