# Unsigned FOSS Tauri **scaffold** (clippy --lib). No installer.
# Full Win/Linux/mac-x64 bundles use the reusable desktop build workflow.
# Signed macOS/Windows: same workflow with sign=true + Environment desktop-signing secrets (see docs/desktop-packaging.md).

name: desktop

on:
  pull_request:
    paths:
      - "gui/desktop/**"
      - "gui/web/**"
      - "src/podcast_mcp/**"
      - "scripts/check_desktop.sh"
      - "scripts/build_desktop.sh"
      - "scripts/build_sidecar.py"
      - "scripts/sidecar_*.rs"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    paths:
      - "gui/desktop/**"
      - "gui/web/**"
      - "src/podcast_mcp/**"
      - "scripts/check_desktop.sh"
      - "scripts/build_desktop.sh"
      - "scripts/build_sidecar.py"
      - "scripts/sidecar_*.rs"
      - ".github/workflows/desktop.yml"
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web-dist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: gui/web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/web/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v7
        with:
          name: gui-web-dist
          path: gui/web/dist

  # Full `tauri build` needs platform runners + icons; scaffold + light Rust hygiene.
  # Same script as `make test-desktop` / scripts/check_desktop.sh (clippy/tests --lib only).
  desktop-scaffold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: web-dist
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Check desktop (scaffold + rustfmt + clippy + lib tests)
        run: ./scripts/check_desktop.sh

  # Compile the Windows-only WebView2 adapters without producing an installer.
  # Full NSIS packaging remains in release-desktop-build.yml.
  desktop-windows-check:
    runs-on: windows-latest
    timeout-minutes: 15
    needs: web-dist
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          name: gui-web-dist
          path: gui/web/dist
      - name: Stage Windows desktop sidecar stub
        run: python scripts/tauri_sidecar_hook.py --dev-stub
      - name: Check Windows desktop binary
        working-directory: gui/desktop/src-tauri
        run: cargo check --bin sharecut --features app
      # Typecheck + test the cfg(windows) arms of the standalone sidecar launcher.
      - name: Check Windows sidecar launcher
        shell: bash
        run: |
          rustc --edition 2021 scripts/sidecar_launcher.rs -o "$RUNNER_TEMP/sharecut-sidecar.exe"
          rustc --edition 2021 --test scripts/sidecar_launcher.rs -o "$RUNNER_TEMP/sidecar-launcher-test.exe"
          "$RUNNER_TEMP/sidecar-launcher-test.exe"
