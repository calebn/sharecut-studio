# Deploy Storybook to GitHub Pages
#
# Builds the static Storybook (gui/web/storybook-static) and publishes it to
# the repo's GitHub Pages environment. The component library is dev-only: the
# static bundle is never shipped in the app or desktop builds.

name: storybook

on:
  push:
    branches: [main]
    paths:
      - "gui/web/**"
      - ".github/workflows/storybook.yml"
  pull_request:
    paths:
      - "gui/web/**"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "storybook-${{ github.event_name }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: gui/web

      - name: Build Storybook
        run: npm run build-storybook
        working-directory: gui/web

      - name: Upload Pages artifact
        if: github.event_name == 'push'
        uses: actions/upload-pages-artifact@v3
        with:
          path: gui/web/storybook-static

  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
