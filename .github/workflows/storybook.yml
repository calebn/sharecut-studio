# Deploy Storybook to GitHub Pages
#
# Builds the static Storybook (gui/web/storybook-static) and publishes it to
# the repo's GitHub Pages environment. The component library is dev-only: the
# static bundle is never shipped in the app or desktop builds.

name: storybook

on:
  push:
    branches: [main]
    paths:
      - "gui/web/**"
      - ".github/workflows/storybook.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "gui/web/**"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('storybook-pr-{0}', github.event.pull_request.number) || github.event_name == 'push' && github.run_attempt == 1 && github.ref == 'refs/heads/main' && 'storybook-main' || format('storybook-run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      playwright: ${{ steps.playwright.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/actions/playwright-image
            gui/web/package-lock.json
          persist-credentials: false

      - name: Resolve the Playwright image
        id: playwright
        uses: ./.github/actions/playwright-image

  sweep:
    # Per-story axe and fit sweep (Vitest browser mode), sharded.
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.playwright }}
      options: --init --ipc=host
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: gui/web

      - name: Sweep every story for axe violations and overflow
        run: npm run test:stories
        env:
          VITE_STORY_SHARD: ${{ matrix.shard }}/4
        working-directory: gui/web

  build:
    needs: image
    if: github.event.pull_request.draft != true
    runs-on: ubuntu-24.04
    container:
      image: ${{ needs.image.outputs.playwright }}
      options: --init --ipc=host
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/web/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: gui/web

      - name: Build Storybook and run the render smoke
        if: github.event_name == 'pull_request'
        run: npm run test:e2e:storybook -- coverage.spec.ts docs-theme.spec.ts
        working-directory: gui/web

      - name: Verify Prepare text layout (Vitest browser)
        if: github.event_name != 'pull_request'
        run: npm run test:layout
        working-directory: gui/web

      - name: Build Storybook and verify browser geometry
        if: github.event_name != 'pull_request'
        run: npm run test:e2e:storybook
        working-directory: gui/web

      - name: Summarize Storybook tests
        if: always()
        continue-on-error: true
        working-directory: .
        run: python3 scripts/test_area_summary.py playwright --area stories --report gui/web/playwright-report/stories.json

      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name)
        uses: actions/upload-pages-artifact@v5
        with:
          path: gui/web/storybook-static

  deploy:
    needs: [build, sweep]
    if: github.ref == 'refs/heads/main' && contains(fromJSON('["push","workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
