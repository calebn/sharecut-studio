name: close-issues-on-develop

on:
  pull_request:
    types: [closed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      pr:
        description: Number of a merged PR whose issues to close
        type: number
        required: true
      dry-run:
        description: Print what would be closed and write nothing
        type: boolean
        default: true

permissions:
  issues: write
  contents: read
  pull-requests: read

concurrency:
  group: close-issues-pr-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: false

jobs:
  close:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - name: Close the issues the merged PR references
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry-run || 'false' }}
        run: python scripts/close_issues_on_develop.py
