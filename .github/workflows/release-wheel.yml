# Release Python wheel with the Sharecut Studio web build inside (#1085).
# hatch_build.py packages gui/web/dist only when it exists, so the web build
# runs first. Callers that publish the wheel take the `podcast-mcp-wheel` artifact.

name: release-wheel

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths: &wheel-paths
      - ".gitignore"
      - "pyproject.toml"
      - "hatch_build.py"
      - "src/podcast_mcp/gui/static_assets.py"
      - "scripts/check_wheel_web_build.py"
      - "gui/web/package.json"
      - "gui/web/package-lock.json"
      - "gui/web/vite.config.ts"
      - ".github/workflows/release-wheel.yml"
  push:
    branches: [main]
    paths: *wheel-paths

permissions:
  contents: read

concurrency:
  group: release-wheel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wheel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: gui/web/package-lock.json

      - uses: astral-sh/setup-uv@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build Sharecut Studio web dist
        working-directory: gui/web
        run: |
          npm ci
          npm run build

      - name: Build sdist and wheel
        run: |
          uv --version
          uv build --verbose --out-dir dist

      - name: Inspect source archives
        if: always()
        run: |
          python - <<'PYTHON'
          import hashlib
          import json
          import tarfile
          from pathlib import Path

          root = Path.cwd()
          dist = root / "dist"
          dist.mkdir(exist_ok=True)
          reports = []
          for archive in sorted(dist.glob("*.tar.gz")):
              with archive.open("rb") as source:
                  digest = hashlib.file_digest(source, "sha256").hexdigest()
              with tarfile.open(archive) as source:
                  members = source.getmembers()
              links = [member for member in members if member.islnk() or member.issym()]
              evidence = []
              for member in links:
                  path = (root / Path(*Path(member.name).parts[1:])).resolve()
                  item = {
                      "name": member.name,
                      "type": member.type.decode("ascii"),
                      "linkname": member.linkname,
                      "offset": member.offset,
                      "data_offset": member.offset_data,
                  }
                  if path.is_relative_to(root) and path.is_file():
                      info = path.stat()
                      item["checkout_file"] = {
                          "path": str(path.relative_to(root)),
                          "device": info.st_dev,
                          "inode": info.st_ino,
                          "links": info.st_nlink,
                      }
                  evidence.append(item)
              generated = [member.name for member in members if "/node_modules/" in member.name]
              reports.append({
                  "archive": str(archive.relative_to(root)),
                  "sha256": digest,
                  "compressed_bytes": archive.stat().st_size,
                  "expanded_member_bytes": sum(member.size for member in members),
                  "member_count": len(members),
                  "generated_dependencies": generated,
                  "links": evidence,
              })
          report = {"archives": reports, "dist_files": sorted(str(path.relative_to(root)) for path in dist.iterdir())}
          (dist / "archive-diagnostics.json").write_text(json.dumps(report, indent=2) + "\n")
          print(json.dumps(report, indent=2))
          if any(
              item["generated_dependencies"] or any(link["type"] == "1" for link in item["links"])
              for item in reports
          ):
              raise SystemExit("source archive contains generated dependencies or hardlinks")
          PYTHON

      - name: Preserve failed wheel build archives
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: wheel-build-diagnostics-${{ github.run_attempt }}
          path: dist/
          if-no-files-found: error

      - name: Install the wheel into a clean venv
        run: |
          uv venv "$RUNNER_TEMP/wheel-venv"
          uv pip install --python "$RUNNER_TEMP/wheel-venv/bin/python" "$(ls dist/*.whl)[gui]"

      - name: Wheel ships the web build and serves it at /
        run: |
          python scripts/check_wheel_web_build.py dist/*.whl \
            --podcast "$RUNNER_TEMP/wheel-venv/bin/podcast"

      - name: Upload wheel
        uses: actions/upload-artifact@v7
        with:
          name: podcast-mcp-wheel
          path: dist/
          if-no-files-found: error
