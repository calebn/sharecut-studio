# Dependabot alerts and security updates are a per-repository GitHub setting,
# not something this file controls (the *-security groups only batch the PRs
# security updates open once that setting is on) — see docs/testing.md § Dependency updates
# and audit. `tests/test_dependabot_config.py` enforces that every tracked
# lockfile directory (gui/web, gui/desktop, gui/desktop/src-tauri, and the
# repo root for uv + github-actions) has exactly one entry below.
version: 2
updates:
  - package-ecosystem: npm
    directory: /gui/web
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    # Hold the stylelint and stylelint-config-standard majors. stylelint 18 cannot
    # install yet: stylelint-declaration-strict-value peers stylelint >=16 <=17,
    # and stylelint-config-standard 41 needs stylelint 18, so npm ci fails with
    # ERESOLVE. Check the plugin with `npm view stylelint-declaration-strict-value
    # peerDependencies`, then delete both entries so Dependabot proposes the pair again.
    ignore:
      - dependency-name: stylelint
        update-types:
          - version-update:semver-major
      - dependency-name: stylelint-config-standard
        update-types:
          - version-update:semver-major
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: npm
    directory: /gui/desktop
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: cargo
    directory: /gui/desktop/src-tauri
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      cargo-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      cargo-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: uv
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      uv-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      uv-security:
        applies-to: security-updates
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    target-branch: develop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
