# Default pipeline parameters — referenced by skills and the engine

performance:
  # 0 = auto (cpu_count-based, capped at 8 workers); 1 = force serial (debugging/
  # deterministic reproduction); N = explicit worker cap. Applies to per-track stem
  # rendering (assemble_timeline/render_dialogue_stems), filler/pause candidate
  # analysis (analyze_fillers_pauses), and per-format export encoding
  # (export_deliverables). See docs/pipeline.md#performance.
  max_workers: 0

master:
  integrated_lufs: -16.0
  # True-peak ceiling. A premix whose peaks would cross it at the gain to
  # integrated_lufs is limited instead of linear-loudnormed (no setting; see
  # docs/audio-engineering.md § Mastering plan).
  true_peak_db: -1.5
  # loudnorm LRA ceiling (pass-through to FFmpeg loudnorm LRA=).
  lra: 11.0
  qc_lufs_tolerance_lu: 0.5
  qc_true_peak_tolerance_db: 0.3

balance:
  dialogue_lufs: -20.0

gate_fill:
  # fill_gate_holes: room tone under each dialogue track's source-gate holes, the
  # digital silence a recorder's noise gate leaves between words (Zoom records each
  # participant through one), so a track never drops to dead air. auto (default)
  # fills every track that has such holes: its recorded room-tone bed first, else
  # comfort noise matched to its own noise under its speech; never another track.
  # A track whose noise is not a floor (within 30 dB of its speech) stays silent.
  # Holes are read from the media, so our own mutes, cuts and pads are never filled.
  # off clears every fill. Undo restores the previous fill. See docs/pipeline.md
  # § Gate fill and docs/audio-engineering.md § Gate fill.
  mode: auto
  # Raised-cosine fade in and out inside each hole (shorter holes fade over half).
  fade_ms: 10

compression:
  threshold_db: -18.0
  ratio: 3.0
  attack_ms: 15.0
  release_ms: 150.0
  # 0 by default. balance_tracks runs after compression and measures the
  # compressed signal, so makeup is compensated by gain staging; non-zero makeup
  # only risks clipping the stem before the mix gain.
  makeup_db: 0.0

prosody:
  # On by default: the step (analyze_prosody) only caches a per-track profile
  # for audition_context to read, no timeline mutation. See docs/pipeline.md
  # § Prosody profile.
  enabled: true
  pitch_floor_hz: 75.0
  pitch_ceiling_hz: 500.0
  # Word gaps at or under this merge into one prosody segment.
  segment_gap_sec: 1.0
  # Longest a merged segment can grow before it is split.
  max_segment_sec: 30.0
  # Shortest interior sub-floor run counted as a pause.
  pause_min_sec: 0.25
  top_prominent_words: 5
  # Boundaries at or above this strength are surfaced (segment_end always is).
  boundary_min_strength: 0.3

focus:
  enabled: false
  auto_apply: false
  review_required: true
  # Optional override — leave empty; agents infer theme from full transcript (podcast-focus-episode)
  episode_promise: null
  max_candidates: 20
  max_remove_pct: 0.15
  segment_merge_gap_sec: 2.5
  min_segment_sec: 15
  repeat_window_sec: 300
  repeat_word_overlap: 0.5
  long_segment_sec: 90
  crossfade_ms: 200
  inaudible_opt: true

tighten:
  # Default pipeline auto-tighten is OFF until prev→next join quality passes ear QA
  # (discourse "like" over-cut + broken splice flow). Manual propose/apply still works.
  # See docs/filler-cut-quality.md § Default pipeline status.
  enabled: false
  # ripple = session/track REMOVE (default). mute = mute the filler window in
  # place (Clip.mute_regions) over filler_pad_mode's fill; each edge fades on one
  # track, so a mute gets the padded-cut checks below, not the splice checks or
  # peer scoping, keeps breaths whole and skips inaudible audio. Pause
  # candidates are skipped (muting a pause is a no-op). See
  # docs/filler-cut-quality.md § Mute vs cut.
  edit_mode: ripple
  # light | medium | aggressive. medium = the values below unchanged; light /
  # aggressive override only the keys they name, and only where the run config
  # still holds this file's value (edits/tighten_intensity.py). A key the working
  # set / Pipeline tab changed from this file wins. Edits made in this file are
  # the baseline, so light/aggressive still override them, and a key set to
  # exactly this file's value counts as untouched.
  # CLI --intensity / MCP intensity= win over this key. Propose-time only.
  # CLI propose-edits / MCP propose_edits read this file, not the GUI working
  # set (MCP pipeline_run uses the working set by default).
  intensity: medium
  # Tuning guide: docs/filler-cut-quality.md
  crossfade_ms: 25
  max_pause_sec: 1.2
  # Propose review-only repetition:/restart: hits (light intensity turns this off).
  repetition_candidates: true
  # Review-only local DSP candidates for voiced audio hidden in ASR gaps.
  # This never auto-applies: VAD can mistake breaths/noise for words.
  acoustic_gap_filler:
    enabled: true
    min_gap_sec: 0.35
    max_run_sec: 1.5
    max_frames: 600
    # Breath rejection for each candidate run: heuristic by default, Silero
    # only when explicitly selected (falls back if unavailable or not 16 kHz).
    vad_backend: heuristic
  # Floor left after trimming a long pause. Turn/dead-air (peer speaking in the
  # gap) can go this short. Solo same-speaker pauses use the higher floor below
  # so thinking / list-restart air is not crushed to a hard edit.
  min_retained_pause_sec: 0.18
  min_retained_solo_pause_sec: 0.55
  # After filler / NL hesitation cuts: remove the voiced hesitation, but keep
  # a fraction of the original inter-word gap as pad (not a fixed 0.3–0.5s —
  # that band is only the floor for short um/uh; longer "you know" gaps need
  # more air or neighbors slam together).
  # pad = clamp(min_gap, gap * retain_fraction, max_pad), where gap is the larger
  # of the flanking-word air the cut takes and the span it finally removes.
  min_gap_after_filler_sec: 0.35
  filler_gap_retain_fraction: 0.85
  filler_replace_gap_max_sec: 1.0
  # Keep this much lead-in before the next retained word when replacing a
  # hesitation (protects onsets like the L in "like" after a silence pad).
  # Skipped when the next ASR token overlaps the filler (um→you).
  filler_next_word_lead_in_ms: 80
  # Keep previous-word release past ASR end (nasals ring). Adaptive to energy
  # (see recommend_prev_word_lead_out_ms); fixed legacy key alone still works.
  filler_prev_word_lead_out_min_ms: 40
  filler_prev_word_lead_out_max_ms: 250
  filler_prev_word_look_ahead_ms: 300
  # Tiny declick out of the previous word into the paced pad (not a full 15ms
  # join fade — that swallows consonant releases once the pad opens a hole).
  filler_pre_pad_fade_out_ms: 5
  # Post-pad fade-in is adaptive to resume-edge energy (see cut_quality).
  # Quiet air → min; hot/late onset within look-ahead → toward max. A detected
  # plosive burst caps it so the ramp ends before the burst; a gradual onset
  # (fricative, glide, vowel) does not.
  filler_post_pad_fade_in_min_ms: 15
  filler_post_pad_fade_in_max_ms: 120
  filler_post_pad_look_ahead_ms: 120
  # With a pad the cut's edges never meet: each fades against silence, so the
  # splice checks below (breath protection, cut-risk level jumps, the join gate)
  # skip it. Its right edge instead stops 10 ms before the next word's acoustic
  # onset (a plosive's burst kept whole), and it may not cover a whole kept word
  # (skip counts next_onset, kept_word:{word}; #978). Mutes get the same edge
  # checks and keep breaths whole (#1024). Every cut stays clear of the flanking
  # kept words' measured voices, read against the track's own voice floor (not
  # analysis.heuristics.audibility_rms_db), or is skipped as kept_voice (#1064).
  filler_room_tone_replace: true
  # room_tone = the track's recorded bed, else a steady stretch of its own audio
  # at its noise floor and 30+ dB under its speech, nearest the cut
  # (edits/room_tone.py, #1054); a track gated to digital silence stays silent
  # (default). silence = hard gap on every track. Also the fill laid under an
  # approved mute.
  filler_pad_mode: room_tone
  # Cap how far replace may expand a cut toward flanking words.
  filler_room_tone_max_expand_sec: 2.0
  # Both splice sides below this RMS (dBFS) are inaudible: room tone against gated
  # digital silence reads "inaudible splice" (pass) instead of a level jump.
  inaudible_floor_db: -60.0
  # When another dialogue stem is speaking in the cut window, do not
  # cross-track ripple (avoids mid-word chops when ASR missed a word).
  speech_energy_guard:
    enabled: true
    # track_local = punch silence on the cut track only; skip = refuse;
    # review = track_local + mark review_required.
    on_conflict: track_local
    min_other_rms_db: -42.0
    dominance_db: 3.0
    min_overlap_sec: 0.03
  inaudible_opt: true
  # A lone hard filler (a filler_words entry that is not a discourse marker,
  # e.g. "Um.") is proposed without a cluster; light turns this off. Discourse
  # markers always need min_filler_cluster hits within filler_cluster_gap_sec.
  isolated_filler_candidates: true
  min_filler_cluster: 2
  filler_cluster_gap_sec: 2.0
  # Risk = boundary/ASR confidence + word margins + (cuts without a pad only)
  # the level jump at each edge.
  leave_in_if_risky: true
  max_cut_risk_score: 0.65
  # Fail-closed perceptual join gate (assess_proposed_cut). Skip candidate when
  # verdict is fail. DSP-only until ranker is trained; neural may only elevate.
  # Scores a butt splice, so it runs only on cuts without a paced pad.
  join_continuity_gate: true
  min_filler_confidence: 0.15
  # Discourse markers stay in filler_words but are cut only with an adjacent
  # true disfluency/repeat, a pause on either side, or low ASR confidence.
  # `like` before a subject pronoun ("like I'm doing") is content and never cut.
  # Otherwise they are counted skips (discourse:{token}), including isolated
  # hits rejected by min_filler_cluster.
  # Missing key uses DEFAULT_DISCOURSE_MARKERS. Explicit [] disables demotion
  # (like is a hard filler) and is not the same as omitting the key.
  # Multi-word entries match split ASR tokens (you + know → you know).
  discourse_markers:
    - like
    - you know
    - sort of
    - kind of
  discourse_pause_sec: 0.35
  discourse_confidence_max: 0.6
  # Acknowledgments a listener says while someone else talks. They are speech,
  # never filler hits: matched before filler_words (so Whisper's split "Uh" +
  # "-huh." is "uh huh", not the filler "uh", even when the audibility pass
  # suppressed one half) and counted as backchannel:{phrase}
  # skips. Split "uh uh" is left out: once the hyphen of "-uh" is stripped it
  # reads like a repeated hesitation ("Uh, uh,"). [] disables.
  backchannels:
    - uh huh
    - uh-huh
    - mm hmm
    - mm-hmm
    - mm hm
    - mm-hm
    - mhm
    - uh-uh
  # ASR words match these entries (and discourse_markers) lowercased with
  # leading/trailing punctuation stripped, so Whisper's "Um." and "uh," match.
  filler_words:
    - um
    - uh
    - erm
    - ah
    - like
    - you know
    - sort of
    - kind of
  breath_handling:
    enabled: true
    search_before_ms: 400
    search_after_ms: 250
    min_duration_ms: 80
    max_duration_ms: 450
    attenuate_loud_breaths: false
    attenuate_db: -9.0
    # "heuristic" (RMS-percentile band) or "silero" (VAD speech-probability dip,
    # zero extra install -- bundled with faster-whisper). Falls back to heuristic
    # automatically if unavailable. See docs/audio-engineering.md before switching.
    vad_backend: heuristic

render:
  default_dialogue_join: fade
  # Allow jump-scaled harsh-join fades (recommend_boundary_fades) without smearing
  # typical micro-fades; cut-time micro fades still use inaudible_cuts.micro_fade_ms.
  join_fade_max_ms: 40
  crossfade_curve: tri

mix:
  music_under_vo_db: -18.0
  fade_in_sec: 2.0
  fade_out_sec: 3.0
  duck_db: -10.0
  # The premix sums tracks at unity (no 1/N), then trims the whole mix down so its
  # true peak sits at or below this ceiling (dBTP) before mastering.
  premix_peak_ceiling_db: -1.0

transcribe:
  # Lowest practical WER. Override at setup (`--whisper-model`) or pipeline config.
  model: large-v3-turbo
  language: en
  # false = reuse stored transcripts (and keep hand edits); true = re-run ASR.
  # Run-only: CLI --force, MCP/GUI force_transcribe. Changed audio re-runs, except
  # edited transcripts in unattended runs, which are refused.
  overwrite: false
  # Whisper invents text over silence (#521). faster-whisper's built-in Silero VAD
  # (same model as tighten.vad) skips non-speech before decoding.
  vad:
    enabled: true
    threshold: 0.4
    min_silence_duration_ms: 500
    speech_pad_ms: 300
  decode:
    temperature: [0.0, 0.2, 0.4]
    no_speech_threshold: 0.6
    log_prob_threshold: -1.0
    compression_ratio_threshold: 2.4
    # false = the vocabulary prompt is sent as hotwords (every window) instead.
    condition_on_previous_text: true
    # Skip silent gaps longer than this (s) when a hallucination is suspected; 0 = off.
    hallucination_silence_threshold: 2.0
  # Flag (never delete) words whose own-track peak is below peak_dbfs (suspect_hallucination).
  silence_filter:
    enabled: true
    peak_dbfs: -60.0
  # Forced alignment (#714, #780): re-time Whisper's words with a local wav2vec2
  # CTC aligner (English). Whisper's own word times are not reliable enough for
  # cut decisions, so `enabled` is a tri-state that follows the installed model:
  #   null  (default) on when the word aligner is downloaded (`podcast bootstrap
  #         --component word-aligner`), off when it is not; the run reports
  #         which in artifacts/transcript_timing.json `forced_alignment.reason`
  #         and the step summary ("forced alignment unavailable: ...").
  #   false always Whisper's times, even with the model installed.
  #   true  require the aligner: a run fails before touching any transcript when
  #         the model is missing, with the download command. It never falls
  #         back to Whisper's times silently.
  # Words the aligner cannot place keep Whisper's times (reported per job).
  # Stored transcripts: run-only retime_words (Studio Re-time words, CLI
  # --retime-words, MCP retime_words) re-times them from the ASR cache without
  # Whisper. Not a yaml key: run-only, like overwrite_edited.
  forced_alignment:
    enabled: null
    # Aligned words whose mean character posterior is below this get
    # suspect_hallucination (flag only, never deleted; #195), but only when the
    # audio agrees (#780): the word's own track is quieter than its noise floor
    # + evidence_speech_margin_db over the aligned span (checked at transcribe
    # time), or another dialogue track is evidence_bleed_margin_db louder there
    # (checked by reconcile_transcript, once align_tracks has placed the tracks
    # on one clock; a placement change re-flags). The score alone is low by
    # construction on one-to-four-frame words ("um", "to"), so it never flags on
    # its own. Stored scores keep flagging when enabled is turned off; 0 = off.
    min_word_score: 0.01
    evidence_speech_margin_db: 12.0
    evidence_bleed_margin_db: 3.0

align:
  # Conversation-clock placement after ASR. Uncheck align_tracks for unrelated clips.
  accept:
    # require | waive_unattended | off — same semantics as transcript_refine.mode
    mode: waive_unattended
  # 0 = auto from longest dialogue file. Gap coarse search is hierarchical
  # (not a 0.5s walk of the full span). Late-join uses this bound.
  max_offset_sec: 0
  coarse_step_sec: 0.5
  fine_step_sec: 0.02
  # Equal-length stems and manifest-pinned offsets are locked at their placement; true re-scores them.
  realign: false
  # Moves above this need waveform xcorr confirmation, are never auto-waived unattended,
  # and are export_qc drift errors until accepted.
  large_move_sec: 1.0
  large_move_min_peak: 0.1
  bleed_ngram: 3
  # Clustered bleed matches needed to trust the bleed clock (was 2 before #519;
  # set 2 + bleed_min_share: 0 for the old behaviour).
  min_bleed_matches: 5
  # Weighted share of matched n-grams that must agree; common filler n-grams count 0.2x.
  bleed_min_share: 0.3
  # |bleed Δt| below this → confirm with waveform xcorr (not blind identity); capped at large_move_sec.
  bleed_identity_sec: 1.0
  acoustic_min_peak: 0.05
  acoustic_floor_sec: 0.05
  acoustic_agree_sec: 0.25
  max_word_audibility_sec: 2.0
  # Bleed latency (docs/pipeline.md § Conversation align). Window lags within the
  # tolerance of a pair's median count; a pair residual or an episode-long trend past it
  # flags the lane. 40 ms keeps the lab's honest windows (MAD 7.5 ms) and rejects
  # wrong-syllable peaks (+380..+500 ms).
  bleed_lag_tolerance_sec: 0.04
  # A solved latency, or a move from the current placement, within this is noise: no
  # move. 20 ms is three standard errors of a 5-window median on the lab's spread.
  bleed_lag_deadband_sec: 0.02

analysis:
  ml_backend: "off"
  transcript_mode: reconcile
  reconcile_on_render: true
  # Agent gate after precorrect: require | waive_unattended | off
  # waive_unattended hard-blocks interactive/MCP; auto-waives when
  # PODCAST_BATCH=1 or `podcast pipeline run --unattended`.
  transcript_refine:
    mode: waive_unattended
  speaker_id:
    mode: auto
    bleed_word_threshold: 50
    bleed_ratio_threshold: 0.02
  heuristics:
    audibility_rms_db: -42.0
    bleed_dominance_db: 6.0
    bleed_min_other_rms_db: -50.0
    # Transcript gate (`podcast edit apply-bleed-mute`, #945): what happens to another
    # speaker's copy on a lane wherever that speaker's own track is talking and the
    # lane's own speaker is not. `auto` decides per lane from its bed (median level
    # away from its own speech and the copies): `attenuate` by bleed_attenuation_db
    # when the bed would still be above the 16-bit floor (-90 dBFS) once turned down,
    # which keeps a room mic's bed steady; else `mute`, as on a call app's gated track
    # whose bed is digital silence. Explicit `mute` or `attenuate` overrides it. The
    # lane's own speech is never touched, and the copy never stands in for the peer's
    # own track, even where that track's gate opened late.
    bleed_handling: auto
    bleed_attenuation_db: 20.0
    # Word-span plausibility caps (#979). Whisper and the forced aligner stretch a
    # word across digital silence on a gated track (lab: a 5.84 s "-huh.", a 5.98 s
    # "Uh"). At the end of transcribe_tracks a word longer than its cap whose voiced
    # audio fits the cap is trimmed onto its own recording's voiced runs nearest the
    # span's end that fit in the cap, or to the span's last cap seconds when none is
    # voiced; the old span is kept in the word's trimmed_from. A word holding more
    # voice than its cap covers missing words: it keeps its times, is marked
    # overlong, and goes to the refine queue. 0 turns a class off.
    #
    # Ordinary words. Skip full-span mean RMS, auto-suppress, and text-match
    # suppress when ASR word duration exceeds this. A word the trim could not
    # reach (its recording does not decode) is soft-flagged instead (deferred +
    # artifacts/transcript_timing.json). 2.0 s is the #715 measurement
    # (engines/asr_timing.py): real long words run 1-1.5 s.
    max_word_audibility_sec: 2.0
    # Every token of tighten.filler_words, tighten.backchannels and
    # tighten.discourse_markers ("uh", "huh", "mm", "like", "you", "know"). They
    # are a syllable or two. On the lab recording every one longer than 1.0 s
    # covered at most 0.91 s of its speaker's voiced audio, except in one stretch
    # (Lana, 1571-1604) where she kept voicing past what the transcript holds;
    # those words are overlong.
    max_short_token_sec: 1.0
    # How far past a word's end the trim looks for its voice, never into the next
    # word. Whisper ends spans early on gated tracks: its 5.84 s "-huh." ends 40 ms
    # before Lana's real uh-huh at 1444.36 s. A trimmed span may end up to this far
    # past the old end.
    word_span_end_slack_sec: 0.3
    bleed_text_match_enabled: true
    bleed_text_match_min_overlap_sec: 0.02
    bleed_ratio_warn_threshold: 0.2
    gate_onset_drop_db: 15.0
    boundary_jump_db: 12.0
    min_fade_ms: 10
    recommended_fade_ms: 20
    harsh_fade_max_ms: 80

inaudible_cuts:
  enabled: true
  search_window_ms: 40
  max_shift_ms: 80
  min_word_margin_ms: 5
  micro_fade_ms: 10
  # Short filler/NL: extend cut end through voiced energy that straddles ASR bounds
  short_cut_max_sec: 1.2
  trailing_energy_extend_ms: 350
  trailing_energy_hot_db: -36.0
  trailing_energy_quiet_db: -45.0
  trailing_energy_hop_ms: 10
  # Ripple/restart cuts: absorb quiet air after the cut end up to the next word,
  # leaving absorb_trailing_silence_retain_sec. Skips when next word is farther
  # than max_sec (safe for multitrack ripple medians).
  absorb_trailing_silence: true
  absorb_trailing_silence_retain_sec: 0.4
  absorb_trailing_silence_max_sec: 2.0
  absorb_trailing_silence_quiet_db: -45.0
  weights:
    energy: 0.65
    zero_cross: 0.2
    continuity: 0.15

export:
  wav: true
  formats:
    - ext: mp3
      codec: libmp3lame
      bitrate_kbps: 128
  # Legacy (when `formats` is omitted): mp3_bitrate_kbps applies to a single MP3.
  # Add more FFmpeg outputs, e.g.:
  #   - ext: flac
  #     codec: flac
  #   - ext: opus
  #     codec: libopus
  #     bitrate_kbps: 96
  # Optional per-format: format (container -f), sample_rate, channels, extra_args.
  # SRT/VTT cue-splitting limits (word-timed, on the timeline clock). Common caption
  # guidance: ~2 lines of ~42 characters, ~7s on screen. `podcast transcript
  # export-srt`/`export-vtt` accept the same limits as CLI options.
  captions:
    max_duration_sec: 7.0
    max_chars_per_line: 42
    max_lines: 2
    # Minimum on-screen time (#790): a cue under this is merged into a same-track
    # neighbour (below merge_max_gap_sec, and only if no other track has a word in the
    # gap being bridged), else held to this duration, capped at the next same-track cue
    # and at the next cue on any other track that starts after this cue's natural end
    # (#816).
    min_duration_sec: 1.0
    # Largest gap to a same-track neighbour a sub-minimum cue may still merge across.
    merge_max_gap_sec: 1.5

# Effect presets are defined once, in src/podcast_mcp/effects/presets.py
# (_BUILTIN_PRESETS). `effects:` here is a by-name overlay: add new presets,
# or override a builtin only in a custom PODCAST_MCP_PIPELINE_DEFAULTS file.
# tests/test_effects_presets.py enforces that repo-tracked YAMLs (this file and
# any git-tracked YAML under .agents/, config/, deploy/, tests/fixtures/) do not redefine a builtin preset name.
effects: {}

social_clips:
  default_max_sec: 60
  min_sec: 15
  padding_ms: 150
  max_candidates: 12
  platforms:
    tiktok:
      max_sec: 60
      aspect: "9:16"
    reels:
      max_sec: 90
      aspect: "9:16"
    linkedin:
      max_sec: 120
      aspect: "1:1"
    youtube_shorts:
      max_sec: 60
      aspect: "9:16"

# Perceptual join continuity (FOSS multi-detector fusion). See docs/inaudible-cuts.md.
join_continuity:
  side_sec: 0.045
  # A verdict must hold for edges placed anywhere within this many ms: each edge is
  # scored at -tol, 0 and +tol and the riskiest placement decides. 0 scores one point.
  edge_tolerance_ms: 3.0
  # The spectral-shape detectors (flux, MFCC/LSF/MCA, F0, bicoherence) compare
  # level-normalised spectra, which read as a mismatch between any two windows of
  # quiet air. Their weight ramps from 0 at inaudible_floor_db to full this many dB
  # above it, judged on the splice's louder side. 0 keeps full weight everywhere.
  spectral_audibility_db: 30.0
  sample_rate: 16000
  pass_below: 0.28
  review_below: 0.48
  calibrate: true
  calibrate_n: 24
  calibrate_margin: 1.15
  force_review_multi_hot: true
  enable_enf: false
  neural: true
  weight_click: 1.35
  weight_level: 0.85
  weight_spectral_flux: 1.1
  weight_mfcc: 1.25
  weight_lsf: 1.2
  weight_mca: 1.15
  weight_weighted_spectral: 1.3
  weight_noise_floor: 0.7
  weight_f0: 0.9
  weight_onset: 1.15
  weight_bicoherence: 0.6
