<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>ShareCut Studio</title>
    <link rel="stylesheet" href="./brand-tokens.css" />
    <style>
      html {
        background: var(--color-bg-canvas);
      }
      body {
        font-family: var(--font-family-sans);
        background: var(--color-bg-canvas);
        color: var(--color-text-primary);
        display: grid;
        place-items: center;
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        box-sizing: border-box;
        padding: max(var(--s1), env(safe-area-inset-top))
          max(var(--s1), env(safe-area-inset-right))
          max(var(--s1), env(safe-area-inset-bottom))
          max(var(--s1), env(safe-area-inset-left));
      }
      main {
        display: grid;
        justify-items: center;
        gap: var(--s0);
      }
      .mark {
        block-size: 3rem;
        inline-size: auto;
      }
      .mark .ink {
        fill: var(--color-text-primary);
      }
      .mark .accent {
        fill: var(--color-accent);
      }
      @media (forced-colors: active) {
        .mark .ink,
        .mark .accent {
          fill: CanvasText;
        }
      }
      .retry:not([hidden]) {
        color: var(--color-accent-text);
        min-block-size: var(--tap-comfortable);
        display: inline-grid;
        align-items: center;
        padding-inline: var(--s0);
      }
      p {
        margin: 0;
        max-width: min(100%, var(--measure));
        min-width: 0;
        overflow-wrap: anywhere;
        text-align: center;
        line-height: var(--ratio);
      }
    </style>
  </head>
  <body>
    <main>
      <svg class="mark" viewBox="8 12 80 72" aria-hidden="true" focusable="false"><path class="ink" d="M32 12H58L48 42H32Q24 42 24 34V20Q24 12 32 12Z"/><path class="ink" d="M65 12H80Q88 12 88 20V34Q88 42 80 42H55Z"/><path class="accent" d="M16 54H44L34 84H16Q8 84 8 76V62Q8 54 16 54Z"/><path class="accent" d="M51 54H64Q72 54 72 62V76Q72 84 64 84H41Z"/></svg>
      <p id="status" role="status" aria-live="polite">Starting ShareCut Studio…</p>
      <a id="retry" class="retry" href="sharecut-retry:" hidden>Try again</a>
      <script src="./failure.js"></script>
    </main>
  </body>
</html>
