[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podcast-mcp"
version = "0.1.0"
description = "FOSS CLI and MCP toolkit for podcast multitrack editing, transcription, and mastering"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0",
    "mcp>=2.0.0",
    "faster-whisper>=1.0.0",
    "numpy>=1.26.0",
    "rich>=13.7.0",
    "coolname>=5.0.0",
    "filelock>=3.16.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-xdist>=3.5.0",
    "pytest-timeout>=2.3.0",
    "mypy>=1.10.0",
    "ruff>=0.9.0",
    "bandit[toml]>=1.8.0",
    "vulture>=2.14",
    "deptry>=0.23.0",
    "pre-commit>=4.0.0",
]
speaker = [
    "torch>=2.0.0",
    "speechbrain>=1.0.0",
]
speaker-lite = [
    "resemblyzer>=0.1.3",
    # Pin floor explicitly: resemblyzer -> librosa -> numba is unconstrained upstream,
    # and older numba/llvmlite releases fail to build on Python 3.12+ (no python_requires
    # metadata, just a runtime guard). Force a modern, 3.12+/3.14-compatible resolution.
    "numba>=0.59.0",
]
joinqc = [
    "torch>=2.0.0",
    "librosa>=0.10.0",
    "transformers>=4.40.0",
]
bootstrap = [
    # Downloads/manages static ffmpeg+ffprobe binaries for `podcast bootstrap
    # --component ffmpeg`, so the base install has no system FFmpeg requirement.
    "static-ffmpeg>=3.0",
]
gui = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "starlette>=0.37.0",
]
object-store = [
    "boto3>=1.34.0",
    "botocore>=1.34.0",
]
relay = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "websockets>=14.0",
    "starlette>=0.37.0",
]
# Runtime extras only (not `dev` tooling). Install tooling via `--extra dev`.
all = [
    "torch>=2.0.0",
    "speechbrain>=1.0.0",
    "resemblyzer>=0.1.3",
    "numba>=0.59.0",
    "static-ffmpeg>=3.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.27.0",
    "websockets>=14.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "starlette>=0.37.0",
    "librosa>=0.10.0",
    "transformers>=4.40.0",
]

[project.scripts]
podcast = "podcast_mcp.cli.main:app"
podcast-mcp = "podcast_mcp.mcp.server:main"
podcast-relay = "podcast_relay.app:main"

[project.urls]
Homepage = "https://github.com/calebn/sharecut-studio"
Issues = "https://github.com/calebn/sharecut-studio/issues"

[project.entry-points."podcast_mcp.extensions"]
collaboration = "podcast_mcp.extensions.collaboration:create"
example = "podcast_mcp.extensions.example:create"

[tool.hatch.build.targets.wheel]
packages = ["src/podcast_mcp", "src/podcast_relay"]

[tool.hatch.build.targets.wheel.force-include]
"src/podcast_mcp/util/bootstrap-assets.json" = "podcast_mcp/util/bootstrap-assets.json"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "e2e: uses tests/fixtures/aligned_dialogue (or PODCAST_E2E_PROJECT override)",
    "e2e_slow: live transcribe / full pipeline (minutes)",
    "e2e_real: nightly fixtures (AMI bleed, benchmark regression, real speech)",
    "slow: benchmark or long-running tighten tests",
    "speaker: requires SpeechBrain/torch optional extra",
    "refine_gate: exercises transcript refine hard gate (disables test default mode=off)",
]
addopts = [
    "--cov=podcast_mcp",
    "--cov=podcast_relay",
    "--cov-branch",
    "--cov-report=term-missing:skip-covered",
    "--cov-report=xml:coverage.xml",
    "--cov-fail-under=95",
    # Thread method: Starlette TestClient receive_json blocks in a way that
    # signal-based timeouts often miss (nested guest/tunnel WS deadlocks).
    "--timeout=60",
    "--timeout-method=thread",
]

[tool.mypy]
files = ["src/podcast_mcp"]
python_version = "3.12"
ignore_missing_imports = true

# Timebase-critical modules run strict-grade checks so mixed source/timeline
# clock usage becomes a type error. Expand this list as modules get annotated.
[[tool.mypy.overrides]]
module = [
    "podcast_mcp.util.timebase",
    "podcast_mcp.engines.session_timeline",
    "podcast_mcp.engines.timemap",
    "podcast_mcp.edits.transcript_sync",
    "podcast_mcp.engines.transcript_gated_play",
    "podcast_mcp.edits.transcript_bleed_mute",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_any_generics = true
no_implicit_optional = true
warn_unused_ignores = true
strict_equality = true

[tool.coverage.run]
source = ["podcast_mcp", "podcast_relay"]
branch = true
omit = [
    # Optional neural inference that downloads weights (CI stays torch-free).
    "**/join_neural.py",
    # Protocol-only module (no runtime bodies).
    "**/podcast_mcp/extensions/spi.py",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

# Ruff: lint + format (Biome/oxlint analogue for Python). Line length 100 matches
# existing code (p99 ≈ 86); rules start sensible without boiling the ocean.
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff-specific
]
ignore = [
    # Formatter owns wrapping; E501 still fires on long strings/URLs/comments.
    "E501",
]

[tool.ruff.lint.flake8-bugbear]
# Typer / FastAPI dependency defaults are intentionally evaluated at import time.
extend-immutable-calls = [
    "typer.Option",
    "typer.Argument",
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
    "fastapi.Cookie",
    "fastapi.Form",
    "fastapi.File",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "B011",   # assert False is fine in tests
    "SIM117", # nested with + pytest.raises is often clearer
]
"scripts/**" = [
    "E402",  # sys.path / cwd bootstrap before package imports
]
# Optional heavy imports after availability guards.
"src/podcast_mcp/engines/speaker_id.py" = ["E402"]
"src/podcast_mcp/edits/join_neural.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
docstring-code-format = true

[tool.bandit]
targets = ["src"]
exclude_dirs = ["tests", ".venv", "gui/web/node_modules"]
skips = [
    # Asserts are internal invariants, not a security boundary.
    "B101",
]

[tool.vulture]
paths = ["src"]
min_confidence = 80

[tool.deptry]
known_first_party = ["podcast_mcp", "podcast_relay"]
# Treat the `dev` optional-extra as development tooling (not unused runtime deps).
optional_dependencies_dev_groups = ["dev"]
extend_exclude = [
    "tests",
    "scripts",
    "gui/web",
    "deploy",
    "ux",
]

[tool.deptry.package_module_name_map]
# Optional extras / conditional imports mapped for deptry.
"static-ffmpeg" = "static_ffmpeg"
speechbrain = "speechbrain"
resemblyzer = "resemblyzer"

[tool.deptry.per_rule_ignores]
DEP002 = [
    # Pin floor for speaker-lite (resemblyzer -> numba); not imported directly.
    "numba",
]
